<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RMC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg">
<title>RMC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gate" class="gate" hidden></div>
<header class="top">
  <div>
    <p class="brand">RMC</p>
    <h1 id="screen-title">ホーム</h1>
    <p class="hello" id="hello"></p>
  </div>
  <button type="button" class="bell" data-go="board" aria-label="お知らせ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
</header>

<main>
  <section id="home" class="screen">
    <div id="install-card"></div>
    <div class="next" id="next-card"></div>
    <div class="card" id="archive-card"></div>
    <div class="card" id="worknow-card"></div>
    <div class="tiles" id="tiles"></div>
    <h2 class="sec">お知らせ</h2>
    <ul class="plain" id="notices"></ul>
  </section>

  <section id="chat" class="screen" hidden>
    <div class="field"><label for="room-q">部屋をさがす</label><input id="room-q" type="search" placeholder="部屋の名前で検索"></div>
    <ul class="rows" id="rooms"></ul>
  </section>

  <section id="board" class="screen" hidden>
    <div id="posts"></div>
    <h2 class="sec">アーカイブ</h2>
    <ul class="rows" id="archive-all"></ul>
  </section>

  <section id="schedule" class="screen" hidden>
    <h2 class="sec first" id="month-title"></h2>
    <ul class="events" id="events"></ul>
  </section>

  <section id="meta" class="screen" hidden>
    <div id="meta-card"></div>
  </section>

  <section id="geppo" class="screen" hidden>
    <button type="button" class="back" data-back>‹ 戻る</button>
    <div id="geppo-root"></div>
  </section>
</main>

<nav class="tabs" aria-label="メインメニュー">
  <button data-go="home" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>ホーム</span></button>
  <button data-go="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>チャット</span></button>
  <button data-go="board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/></svg><span>掲示板</span></button>
  <button data-go="schedule"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"/></svg><span>予定</span></button>
  <button data-go="meta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg><span>メタ空間</span></button>
</nav>

<script src="data.js"></script>
<script src="auth.js"></script>
<script src="composer.js"></script>
<script src="app.js"></script>
<script src="install.js"></script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
